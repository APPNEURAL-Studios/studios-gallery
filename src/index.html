<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPNEURAL Studios</title>
<meta name="description" content="Directory of every APPNEURAL studio.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">APPNEURAL</span>
    <h1>Studios</h1>
    <p class="sub">Every studio in the APPNEURAL platform, in one place.</p>
    <input id="search" type="search" placeholder="Search studios…" autocomplete="off">
  </header>

  <p id="count" class="count"></p>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No studios match “<span id="empty-q"></span>”.</p>

  <footer>
    <a href="https://github.com/APPNEURAL-Studios">APPNEURAL-Studios on GitHub</a>
  </footer>
</div>
<script src="./app.js"></script>
</body>
</html>
